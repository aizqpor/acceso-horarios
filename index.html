
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Elección de horario · C.E.M. Luis de Narváez</title>
  <style>
    :root{--blue:#1f5f89;--blue2:#317fad;--blue-soft:#cceafb;--red:#c92a2a;--green:#18794e;--bg:#f1f8fc;--line:#cfe1ec}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font:17px/1.5 system-ui,-apple-system,sans-serif;color:#202124}
    header{padding:22px 18px;color:#143f5b;background:linear-gradient(135deg,#e1f4ff,var(--blue-soft));border-bottom:1px solid #a9d4eb}
    .header-inner{width:min(1250px,100%);margin:auto;display:flex;align-items:center;justify-content:center;gap:28px;position:relative}.header-logo{width:150px;height:150px;object-fit:contain;border-radius:16px}.header-copy{text-align:left}header h1{margin:0;font-size:clamp(25px,5vw,38px);color:#174f74}header p{margin:4px 0 0;font-size:19px;color:#326986}.admin-button{position:absolute;right:0;top:50%;transform:translateY(-50%);display:inline-block;padding:12px 22px;border-radius:10px;background:#317fad;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 4px 12px #174f7430}
    main{width:min(880px,calc(100% - 28px));margin:30px auto 70px}main.wide{width:min(1280px,calc(100% - 28px))}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;margin:18px 0;box-shadow:0 8px 24px #1d173010}
    h2{margin:0 0 16px;color:#174f74} h3{color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}
    label{display:block;font-weight:700;margin-bottom:5px}input,select{width:100%;padding:13px 14px;border:1px solid #aeb4bf;border-radius:10px;font:inherit;background:white}
    button{border:0;border-radius:11px;padding:14px 19px;font:bold 17px system-ui;cursor:pointer}.primary{background:var(--blue2);color:white;width:100%}.secondary{background:#e3f2fa;color:#174f74}.add-child{background:#dfff00;color:#173600;text-transform:uppercase;font-weight:900;box-shadow:0 0 0 3px #b8db00,0 5px 14px #a6c80066}.danger{background:#fff0f0;color:#a61e1e}button,.admin-button{transition:transform .09s ease,box-shadow .09s ease,filter .09s ease;user-select:none;-webkit-tap-highlight-color:transparent}button:hover,.admin-button:hover{filter:brightness(.97)}button:active{transform:translateY(3px) scale(.98);box-shadow:inset 0 2px 5px #00000030}.admin-button:active{transform:translateY(calc(-50% + 3px)) scale(.98);box-shadow:inset 0 2px 5px #00000030}button:focus-visible,.admin-button:focus-visible{outline:3px solid #f3b51b;outline-offset:3px}
    button:disabled{opacity:.55;cursor:wait}.child{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.message{border-left:7px solid var(--blue2)}.error{border-left-color:var(--red)}.success{border-left-color:var(--green)}
    .options{display:grid;gap:10px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:13px}.option input{width:auto;margin-top:5px}.muted{color:#666;font-size:15px}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.timer{font-size:24px;font-weight:800;color:var(--red)}
    .schedule-scroll{overflow-x:auto;padding-bottom:3px}.schedule-grid{width:100%;min-width:650px;border-collapse:separate;border-spacing:0;border:1px solid #b9d5e5;border-radius:13px;overflow:hidden}.schedule-grid th,.schedule-grid td{border-right:1px solid #c8dce8;border-bottom:1px solid #c8dce8;padding:8px;text-align:center;vertical-align:middle}.schedule-grid tr:last-child>*{border-bottom:0}.schedule-grid tr>*:last-child{border-right:0}.schedule-grid thead th{background:#1f6f99;color:white;font-size:16px}.schedule-grid thead th:first-child{background:#edf7fc;color:#174f74}.schedule-grid .time-cell{width:112px;background:#f5fafc;color:#174f74;font-weight:800;white-space:nowrap}.schedule-grid td{min-width:135px;background:#fff}.slot-choice{width:100%;min-height:66px;padding:8px;border:2px solid transparent;border-radius:10px;background:#e7f5ec;color:#12633d;font-size:14px;line-height:1.25}.slot-choice:hover{filter:brightness(.97)}.slot-choice.selected{background:#ffd8e8;color:#7b1640;border-color:#dc4f89;box-shadow:0 0 0 2px #dc4f8930}.slot-choice strong,.chosen-entry strong{display:block}.slot-choice .places{display:block;font-size:13px;margin-top:4px}.empty-cell{color:#b4c0c7;font-size:20px}.choice-inputs{display:none}.chosen-card{border:2px solid #9ccde5}.chosen-entry{border-radius:9px;padding:7px 8px;color:#123f59;font-size:13px;line-height:1.2;margin:2px 0}.tone-instrument{background:#d9f3e4}.tone-language{background:#d9ebff}.tone-ensemble{background:#ffd8e8}.tone-choir{background:#fff0b8}.schedule-legend{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}.schedule-legend span{padding:5px 9px;border-radius:999px;font-size:13px;font-weight:700}.choice-quadrants{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.choice-quadrants>.card{margin:0;height:100%;padding:18px}.choice-quadrants .schedule-grid{min-width:0;font-size:13px}.choice-quadrants .schedule-grid th,.choice-quadrants .schedule-grid td{padding:5px}.choice-quadrants .schedule-grid .time-cell{width:84px}.choice-quadrants .slot-choice{min-height:54px;padding:5px;font-size:12px}.review-actions{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:18px}
    @media(max-width:900px){.choice-quadrants{display:block}.choice-quadrants>.card{margin:18px 0;padding:26px}.choice-quadrants .schedule-grid{min-width:650px;font-size:inherit}.choice-quadrants .schedule-grid th,.choice-quadrants .schedule-grid td{padding:8px}.choice-quadrants .slot-choice{min-height:66px;padding:8px;font-size:14px}}
    @media(max-width:760px){.header-inner{gap:14px;justify-content:flex-start;padding-bottom:58px}.header-logo{width:105px;height:105px}.header-copy{text-align:left}.admin-button{top:auto;right:50%;bottom:0;transform:translateX(50%)}.admin-button:active{transform:translateX(50%) translateY(3px) scale(.98)}.grid{grid-template-columns:1fr}.card{padding:19px}.full{grid-column:auto}.schedule-grid,.choice-quadrants .schedule-grid{min-width:570px}.schedule-grid th,.schedule-grid td,.choice-quadrants .schedule-grid th,.choice-quadrants .schedule-grid td{padding:6px}.slot-choice,.choice-quadrants .slot-choice{min-height:60px;padding:7px;font-size:13px}.choice-quadrants>.card{padding:19px}.review-actions{grid-template-columns:1fr}}
    footer{text-align:center;padding:0 16px 35px;color:#657985;font-size:14px}
  </style>
</head>
<body>
  <header><div class="header-inner"><img class="header-logo" src="logo-conservatorio.png" alt="Logotipo del C.E.M. Luis de Narváez"><div class="header-copy"><h1 id="center">C.E.M. Luis de Narváez</h1><p id="year">Elección de horario</p></div><a class="admin-button" href="admin.html">ADMINISTRACIÓN</a></div></header>
  <main id="app"><section class="card">Cargando información…</section></main>
  <footer></footer>
  <script>
    const API='https://horarios.cemluisdenarvaez.es';
    const token=new URLSearchParams(location.search).get('token')||'';
    let config=null,election=null,timer=null;
    document.addEventListener('DOMContentLoaded',()=>token?loadElection():loadRegistration());

    async function api(path,options={}){
      const response=await fetch(API+path,{...options,headers:{'content-type':'application/json',...(options.headers||{})},cache:'no-store'});
      const data=await response.json().catch(()=>({ok:false,message:'Respuesta no válida del servidor.'}));
      if(!response.ok)throw new Error(data.message||'No se ha podido completar la operación.');
      return data;
    }
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function showError(error){document.getElementById('app').innerHTML=`<section class="card message error"><h2>No se ha podido continuar</h2><p>${esc(error.message||error)}</p><button class="secondary" onclick="location.reload()">Volver a comprobar</button></section>`;}

    async function loadRegistration(){
      try{config=await api('/api/configuracion');setHeader();renderRegistration();}catch(e){showError(e)}
    }
    function setHeader(){document.getElementById('center').textContent=config.centerName;document.getElementById('year').textContent='Elección de horario '+config.academicYear;}
    function renderRegistration(){
      const openCourses=[...new Set(config.sessions.filter(s=>new Date(s.registrationOpen)<=new Date(config.now)&&new Date(s.selectionClose||s.registrationClose)>new Date(config.now)).flatMap(s=>s.courses))];
      if(!openCourses.length){document.getElementById('app').innerHTML='<section class="card message"><h2>Inscripción cerrada</h2><p>Ahora mismo no se están asignando nuevos números de orden.</p></section>';return;}
      const courses=openCourses.sort().map(c=>`<option value="${c}">${c}.º</option>`).join('');
      const instruments=config.instruments.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');
      document.getElementById('app').innerHTML=`<form id="registration"><section class="card"><h2>Inscripción y obtención de número de orden</h2><div class="grid"><div class="full"><label>Nombre y apellidos del alumno/a</label><input name="studentName" required maxlength="140" autocomplete="name"></div><div><label>Fecha de nacimiento</label><input name="birthDate" type="date" lang="es" min="1900-01-01" max="2035-12-31" required autocomplete="bday"></div><div><label>Curso</label><select name="course" required>${courses}</select></div><div><label>Instrumento</label><select name="instrumentId" required>${instruments}</select></div><div><label>Correo electrónico</label><input name="email" type="email" required maxlength="180" autocomplete="email"></div><div><label>Confirmar correo electrónico</label><input name="emailConfirm" type="email" required maxlength="180" autocomplete="off" autocapitalize="none" spellcheck="false"></div></div><p class="muted">Escriba de nuevo el correo electrónico. Por seguridad, no se permite pegarlo en el segundo campo.</p></section><section class="card"><button id="send" class="primary">Obtener número de orden</button></section></form>`;
      const confirmEmail=document.querySelector('[name=emailConfirm]');
      ['paste','drop'].forEach(type=>confirmEmail.addEventListener(type,event=>{event.preventDefault();alert('Escriba manualmente la confirmación del correo electrónico.')}));
      document.getElementById('registration').addEventListener('submit',submitRegistration);
    }
    async function submitRegistration(event){
      event.preventDefault();const form=event.currentTarget,button=document.getElementById('send');button.disabled=true;button.textContent='Asignando números…';
      const email=form.email.value.trim().toLowerCase(),emailConfirm=form.emailConfirm.value.trim().toLowerCase();
      if(email!==emailConfirm){button.disabled=false;button.textContent='Obtener número de orden';return alert('Los dos correos electrónicos no coinciden. Revise que estén escritos exactamente igual.')}
      const child={name:form.studentName.value,birthDate:form.birthDate.value,course:Number(form.course.value),instrumentId:Number(form.instrumentId.value)};
      const body={email,emailConfirm,children:[child]};
      try{const data=await api('/api/registro',{method:'POST',body:JSON.stringify(body)});document.getElementById('app').innerHTML=`<section class="card message success"><h2>Número de orden asignado</h2><p>Hemos enviado la confirmación a <strong>${esc(body.email)}</strong>.</p>${data.students.map(s=>`<p><strong>${esc(s.name)}</strong><br>${s.course}.º · ${esc(s.instrument)} · Número <strong>${s.queueNumber}</strong></p>`).join('')}</section>`;}catch(e){button.disabled=false;button.textContent='Obtener número de orden';alert(e.message)}
    }

    async function loadElection(){try{election=await api('/api/eleccion?token='+encodeURIComponent(token));renderElection();}catch(e){showError(e)}}
    function renderElection(){
      const s=election.student;document.getElementById('center').textContent='C.E.M. Luis de Narváez';
      document.querySelector('main').classList.toggle('wide',election.state==='ACTIVE'&&s.course>=3);
      if(election.state==='WAITING'){document.getElementById('app').innerHTML=`<section class="card message"><h2>Turno pendiente</h2><p><strong>${esc(s.name)}</strong> · ${s.course}.º · ${esc(s.instrument)}</p><p>Número de orden: <strong>${s.queueNumber}</strong></p><p>Familias por delante: <strong>${election.peopleAhead}</strong></p><p>Recibirá un correo cuando se aproxime su turno y otro cuando pueda comenzar.</p></section>`;return;}
      if(election.state==='COMPLETED'){document.getElementById('app').innerHTML=`<section class="card message success"><h2>Horario confirmado</h2><p>La elección de <strong>${esc(s.name)}</strong> está registrada.</p></section>`;return;}
      if(election.state==='EXPIRED'){document.getElementById('app').innerHTML=`<section class="card message error"><h2>Turno finalizado</h2><p>${esc(election.message)}</p></section>`;return;}
      const o=election.options;
      const senior=s.course>=3;
      document.getElementById('app').innerHTML=`<form id="choice"><section class="card"><div class="row"><div><h2>${esc(s.name)}</h2><p>${s.course}.º · ${esc(s.instrument)} · Número ${s.queueNumber}</p></div><div><div class="muted">Tiempo restante</div><div id="timer" class="timer"></div></div></div></section><div id="choiceEditor">${senior?`<section class="card"><label class="option"><input id="solo" type="checkbox" onchange="toggleCollectives()"><span><strong>Solo estoy matriculado/a en Instrumento</strong><br><span class="muted">No curso otras asignaturas.</span></span></label></section><div class="choice-quadrants">${calendarOptionBlock('Instrumento','instrumentOptionId',o.instrument,'instrument')}<div id="collectives" style="display:contents">${calendarOptionBlock('Lenguaje Musical','languageOptionId',o.language,'language')}${calendarOptionBlock('Agrupaciones Musicales','ensembleOptionId',o.ensemble,'ensemble')}${calendarOptionBlock('Coro','choirOptionId',o.choir,'choir')}</div></div><section id="chosenSchedule" class="card chosen-card"></section>`:`${optionBlock('Bloques de Instrumento y Lenguaje Musical','instrumentOptionId',o.instrument,true)}<section class="card"><p><strong>Elegirá un único bloque completo.</strong> Incluye Instrumento y todas las sesiones del grupo de Lenguaje Musical vinculado.</p></section>`}<section class="card"><button id="confirm" class="primary">Revisar horario</button></section></div><section id="reviewPanel" class="card chosen-card hidden"></section></form>`;
      document.getElementById('choice').addEventListener('submit',submitChoice);startTimer();
      if(senior){refreshSelectionVisuals();renderChosenSchedule()}
    }
    function optionBlock(title,name,options,required){return `<section class="card"><h2>${title}</h2><div class="options">${options.length?options.map((o,i)=>`<label class="option"><input type="radio" name="${name}" value="${o.id}" ${required&&i===-1?'required':''}><span><strong>${esc(o.group)}</strong><br>${esc(o.days)} · ${esc(o.start)}–${esc(o.end)}${o.detail?`<br><span class="muted">${esc(o.detail)}</span>`:''}<br><span class="muted">${o.remaining} plaza(s) disponibles</span></span></label>`).join(''):'<p>No hay opciones disponibles.</p>'}</div></section>`;}
    const WEEK_DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes'];
    function optionMeetings(option){return Array.isArray(option?.meetings)&&option.meetings.length?option.meetings:[{days:option?.days,start:option?.start,end:option?.end}]}
    function meetingDays(meeting){const text=String(meeting?.days||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return WEEK_DAYS.filter(day=>text.includes(day.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()))}
    function optionDays(option){return WEEK_DAYS.filter(day=>optionMeetings(option).some(meeting=>meetingDays(meeting).includes(day)))}
    function calendarOptionBlock(title,name,options,tone){
      if(!options.length)return `<section class="card"><h2>${title}</h2><p>No hay opciones disponibles.</p></section>`;
      const days=WEEK_DAYS.filter(day=>options.some(option=>optionDays(option).includes(day)));
      const intervals=[...new Map(options.flatMap(option=>optionMeetings(option)).map(meeting=>[`${meeting.start}|${meeting.end}`,{start:meeting.start,end:meeting.end}])).values()].sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));
      const inputs=options.map(option=>`<input type="radio" name="${name}" value="${option.id}">`).join('');
      const rows=intervals.map(interval=>`<tr><th class="time-cell">${esc(interval.start)}–${esc(interval.end)}</th>${days.map(day=>{const matches=options.filter(option=>optionMeetings(option).some(meeting=>meeting.start===interval.start&&meeting.end===interval.end&&meetingDays(meeting).includes(day)));return `<td>${matches.length?matches.map(option=>`<button type="button" class="slot-choice tone-${tone}" data-choice-name="${name}" data-option-id="${option.id}" onclick="chooseSchedule('${name}',${option.id})"><strong>${esc(option.group)}</strong><span class="places">${option.remaining} plaza${option.remaining===1?'':'s'} libre${option.remaining===1?'':'s'}</span></button>`).join(''):'<span class="empty-cell">—</span>'}</td>`}).join('')}</tr>`).join('');
      return `<section class="card"><h2>${title}</h2><div class="choice-inputs">${inputs}</div><div class="schedule-scroll"><table class="schedule-grid"><thead><tr><th>Hora</th>${days.map(day=>`<th>${day}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
    }
    function chooseSchedule(name,id){const input=document.querySelector(`input[name="${name}"][value="${id}"]`);if(input){input.checked=true;refreshSelectionVisuals();renderChosenSchedule()}}
    function refreshSelectionVisuals(){document.querySelectorAll('.slot-choice').forEach(button=>{const input=document.querySelector(`input[name="${button.dataset.choiceName}"][value="${button.dataset.optionId}"]`);button.classList.toggle('selected',Boolean(input?.checked))})}
    function selectedOptions(){
      const solo=Boolean(document.getElementById('solo')?.checked),groups=[['instrumentOptionId','Instrumento','instrument'],['languageOptionId','Lenguaje Musical','language'],['ensembleOptionId','Agrupaciones','ensemble'],['choirOptionId','Coro','choir']];
      const pools={instrumentOptionId:election.options.instrument,languageOptionId:election.options.language,ensembleOptionId:election.options.ensemble,choirOptionId:election.options.choir};
      return groups.filter(([name])=>!solo||name==='instrumentOptionId').map(([name,label,tone])=>{const id=selected(name),option=pools[name].find(item=>item.id===id);return option?{...option,label,tone}:null}).filter(Boolean);
    }
    function renderChosenSchedule(){
      const box=document.getElementById('chosenSchedule');if(!box)return;const chosen=selectedOptions();
      if(!chosen.length){box.innerHTML='<h2>Tu horario seleccionado</h2><p class="muted">Los tramos que selecciones aparecerán aquí colocados por día y hora.</p>';return}
      const expanded=chosen.flatMap(option=>optionMeetings(option).flatMap(meeting=>meetingDays(meeting).map(day=>({...option,day,start:meeting.start,end:meeting.end}))));
      const days=WEEK_DAYS.filter(day=>expanded.some(option=>option.day===day)),intervals=[...new Map(expanded.map(option=>[`${option.start}|${option.end}`,{start:option.start,end:option.end}])).values()].sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));
      const rows=intervals.map(interval=>`<tr><th class="time-cell">${esc(interval.start)}–${esc(interval.end)}</th>${days.map(day=>{const entries=expanded.filter(option=>option.start===interval.start&&option.end===interval.end&&option.day===day);return `<td>${entries.map(option=>`<div class="chosen-entry tone-${option.tone}"><strong>${esc(option.label)}</strong>${esc(option.group)}</div>`).join('')||'<span class="empty-cell">—</span>'}</td>`}).join('')}</tr>`).join('');
      box.innerHTML=`<h2>Tu horario seleccionado</h2><div class="schedule-legend"><span class="tone-instrument">Instrumento</span><span class="tone-language">Lenguaje Musical</span><span class="tone-ensemble">Agrupaciones</span><span class="tone-choir">Coro</span></div><div class="schedule-scroll"><table class="schedule-grid"><thead><tr><th>Hora</th>${days.map(day=>`<th>${day}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    function toggleCollectives(){const solo=document.getElementById('solo').checked;document.getElementById('collectives').classList.toggle('hidden',solo);if(solo)document.querySelectorAll('#collectives input[type=radio]').forEach(input=>input.checked=false);refreshSelectionVisuals();renderChosenSchedule()}
    function selected(name){const e=document.querySelector(`[name="${name}"]:checked`);return e?Number(e.value):null}
    let pendingChoice=null;
    async function submitChoice(event){
      event.preventDefault();const choice={instrumentOptionId:selected('instrumentOptionId'),languageOptionId:selected('languageOptionId'),ensembleOptionId:selected('ensembleOptionId'),choirOptionId:selected('choirOptionId'),soloInstrument:Boolean(document.getElementById('solo')?.checked)};
      try{const checked=await api('/api/eleccion/comprobar',{method:'POST',body:JSON.stringify({token,choice})});pendingChoice=choice;showChoiceReview(checked.summary)}catch(e){alert(e.message)}
    }
    function showChoiceReview(summary){
      document.getElementById('choiceEditor').classList.add('hidden');const panel=document.getElementById('reviewPanel');panel.classList.remove('hidden');panel.innerHTML=`<h2>Tu horario seleccionado</h2><p>Compruebe que todos los tramos son correctos antes de confirmar definitivamente.</p>${summarySchedule(summary)}<div class="review-actions"><button type="button" class="secondary" onclick="editChoice()">Editar horario</button><button type="button" class="primary" onclick="confirmChoice()">Confirmar definitivamente</button></div>`;panel.scrollIntoView({behavior:'smooth',block:'start'})
    }
    function summarySchedule(summary){
      const labels={instrument:'Instrumento',language:'Lenguaje Musical',ensemble:'Agrupaciones',choir:'Coro'},tones={instrument:'instrument',language:'language',ensemble:'ensemble',choir:'choir'},expanded=[];
      for(const [key,option] of Object.entries(summary||{})){if(!option)continue;for(const meeting of optionMeetings(option))for(const day of meetingDays(meeting))expanded.push({...option,label:labels[key],tone:tones[key],day,start:meeting.start,end:meeting.end})}
      const days=WEEK_DAYS.filter(day=>expanded.some(option=>option.day===day)),intervals=[...new Map(expanded.map(option=>[`${option.start}|${option.end}`,{start:option.start,end:option.end}])).values()].sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end));
      const rows=intervals.map(interval=>`<tr><th class="time-cell">${esc(interval.start)}–${esc(interval.end)}</th>${days.map(day=>{const entries=expanded.filter(option=>option.start===interval.start&&option.end===interval.end&&option.day===day);return `<td>${entries.map(option=>`<div class="chosen-entry tone-${option.tone}"><strong>${esc(option.label)}</strong>${esc(option.group)}</div>`).join('')||'<span class="empty-cell">—</span>'}</td>`}).join('')}</tr>`).join('');
      return `<div class="schedule-scroll"><table class="schedule-grid"><thead><tr><th>Hora</th>${days.map(day=>`<th>${day}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`
    }
    function editChoice(){document.getElementById('reviewPanel').classList.add('hidden');document.getElementById('choiceEditor').classList.remove('hidden');document.getElementById('choiceEditor').scrollIntoView({behavior:'smooth',block:'start'})}
    async function confirmChoice(){const button=document.querySelector('#reviewPanel .primary');button.disabled=true;button.textContent='Confirmando…';try{await api('/api/eleccion/confirmar',{method:'POST',body:JSON.stringify({token,choice:pendingChoice})});clearInterval(timer);await loadElection()}catch(e){button.disabled=false;button.textContent='Confirmar definitivamente';alert(e.message)}}
    function summaryText(summary){const names={instrument:'Instrumento',language:'Lenguaje Musical',ensemble:'Agrupaciones',choir:'Coro'};return Object.entries(summary).filter(([,v])=>v).map(([k,v])=>`${names[k]}: ${v.group} · ${v.days} ${v.start}–${v.end}`).join('\n')}
    function startTimer(){clearInterval(timer);const tick=()=>{const left=Math.max(0,new Date(election.deadline)-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);document.getElementById('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;if(!left){clearInterval(timer);loadElection()}};tick();timer=setInterval(tick,1000)}
  </script>
</body>
</html>
